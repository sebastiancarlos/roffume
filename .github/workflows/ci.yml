name: Test (Linux, macOS)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  # Allow manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Ubuntu apt ships pandoc 3.1.x, but the Lua filter needs >= 3.5,
      - name: Install pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y groff poppler-utils

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install groff poppler

      - name: Run e2e suite
        run: ./test
